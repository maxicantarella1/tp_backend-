# Puerto de este microservicio (Actividades usa el 8081)
server.port=8082
spring.application.name=reservas-service

# H2 en memoria: solo desarrollo. Con Docker pasará a PostgreSQL.
spring.datasource.url=jdbc:h2:mem:reservasdb
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# URL del servicio de Actividades (en Docker será http://actividades:8081)
actividades.url=http://localhost:8081
