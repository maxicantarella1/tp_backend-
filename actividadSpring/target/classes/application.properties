# Puerto de este microservicio (Reservas usa el 8082)
server.port=8081
spring.application.name=actividades-service

# Base H2 EN MEMORIA: se borra al apagar la app. Solo desarrollo. Con Docker pasará a PostgreSQL.
spring.datasource.url=jdbc:h2:mem:actividadesdb
spring.jpa.hibernate.ddl-auto=update

# API EXTERNA de geocodificación (Open-Meteo, gratuita y sin clave)
geocoding.url=https://geocoding-api.open-meteo.com

# La consola H2 queda DESACTIVADA: expondría la base de datos sin autenticación.
spring.h2.console.enabled=false

# ---------------- SEGURIDAD (Keycloak) ----------------
# issuer-uri: el token debe haber sido emitido por este realm (se valida el claim "iss").
# jwk-set-uri: de dónde se bajan las claves públicas para verificar la firma. Se separan porque, dentro de Docker,
# el servicio llega a Keycloak por otro nombre (keycloak:8080) que el "issuer" público (localhost:8180).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/turismo}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/turismo/protocol/openid-connect/certs}
