# Puerto de este microservicio (Reservas usa el 8082)
server.port=8081

# Base H2 EN MEMORIA: se borra al apagar la app. Solo para desarrollo y pruebas.
# Más adelante, con Docker, se reemplaza por PostgreSQL (persistente).
spring.datasource.url=jdbc:h2:mem:actividadesdb

# update: Hibernate crea/ajusta las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update

# Consola web de H2 en http://localhost:8081/h2-console para ver las tablas
spring.h2.console.enabled=true
