# Puerto único de entrada al backend (los clientes externos solo hablan con el 8080)
server.port=8080
spring.application.name=api-gateway

# ---------------- MICROSERVICIOS DESTINO (Trusted Zone) ----------------
# En local apuntan a localhost:8081 y localhost:8082. En Docker se inyectan por variable de entorno.
actividades.url=${ACTIVIDADES_URL:http://localhost:8081}
reservas.url=${RESERVAS_URL:http://localhost:8082}

# ---------------- SEGURIDAD (Keycloak OIDC / JWT) ----------------
# El Gateway actúa como primera barrera (Security Filter): verifica firma, emisor y vencimiento del JWT.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/turismo}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/turismo/protocol/openid-connect/certs}
