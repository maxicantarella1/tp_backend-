# Puerto de este microservicio (Actividades usa el 8081; Gateway el 8080)
server.port=8082
spring.application.name=reservas-service

# ---------------- PERSISTENCIA ----------------
# Por defecto en desarrollo/tests usa H2 en memoria. En Docker se inyectan las variables apuntando a PostgreSQL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:reservasdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
# La consola H2 queda DESACTIVADA: expondría la base de datos sin autenticación.
spring.h2.console.enabled=false

# Otro microservicio (en Docker será http://actividades:8081)
actividades.url=${ACTIVIDADES_URL:http://localhost:8081}

# APIs PÚBLICAS EXTERNAS (gratuitas, sin clave)
clima.url=https://api.open-meteo.com
aire.url=https://air-quality-api.open-meteo.com
feriados.url=https://api.argentinadatos.com

# Reevaluación automática de reservas (cron de Spring: seg min hora día mes día-semana). Por defecto cada hora en punto.
reservas.reevaluar.cron=0 0 * * * *

# ---------------- SEGURIDAD (Keycloak) ----------------
# Este servicio VERIFICA los tokens de los usuarios (resource server). issuer-uri = quién debe haberlos emitido;
# jwk-set-uri = de dónde se bajan las claves públicas para verificar la firma (separadas por el uso en Docker).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/turismo}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_URI:http://localhost:8180/realms/turismo/protocol/openid-connect/certs}

# Este servicio también ACTÚA COMO CLIENTE: se autentica ante Keycloak con su cuenta de servicio para llamar a Actividades.
# En producción el secreto va por variable de entorno, nunca en el repositorio.
keycloak.token-url=${KEYCLOAK_TOKEN_URL:http://localhost:8180/realms/turismo/protocol/openid-connect/token}
keycloak.client-id=reservas-service
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:reservas-secret}
